<aside class="sidebar">
  <nav class="sidebar-nav">
    @for (item of menuItems; track item.route) {
      <div
        class="nav-item"
        [class.active]="isActive(item.route)"
        (click)="navigateTo(item.route)"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </div>
    }
  </nav>
</aside>
